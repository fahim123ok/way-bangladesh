<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gemini Model Lab</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f11; color: #e2e2e2; height: 100vh; display: flex; flex-direction: column; }

  .top { background: #1a1a1f; border-bottom: 1px solid #2e2e38; padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .top h1 { font-size: 16px; font-weight: 600; color: #fff; white-space: nowrap; }

  .key-wrap { display: flex; gap: 8px; flex: 1; min-width: 280px; }
  .key-wrap input { flex: 1; background: #252530; border: 1px solid #3a3a48; border-radius: 8px; padding: 8px 12px; color: #e2e2e2; font-size: 13px; outline: none; }
  .key-wrap input:focus { border-color: #6c6cff; }

  .model-wrap { display: flex; gap: 8px; align-items: center; }
  .model-wrap select { background: #252530; border: 1px solid #3a3a48; border-radius: 8px; padding: 8px 12px; color: #e2e2e2; font-size: 13px; outline: none; cursor: pointer; }
  .model-wrap select:focus { border-color: #6c6cff; }

  button { background: #5a5aff; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background 0.15s; }
  button:hover { background: #7070ff; }
  button:disabled { background: #3a3a4a; color: #666; cursor: not-allowed; }
  button.danger { background: #c0392b; }
  button.danger:hover { background: #e74c3c; }
  button.secondary { background: #2e2e3e; }
  button.secondary:hover { background: #3e3e50; }

  .scan-bar { background: #1a1a1f; border-bottom: 1px solid #2e2e38; padding: 10px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .scan-bar span { font-size: 13px; color: #888; }
  .scan-results { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .model-pill { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
  .model-pill.ok { background: #1a3a2a; color: #4caf82; border: 1px solid #2a5a3a; }
  .model-pill.ok:hover { background: #2a4a3a; }
  .model-pill.ok.selected { background: #2a5a3a; border-color: #4caf82; }
  .model-pill.err { background: #3a1a1a; color: #e57373; border: 1px solid #5a2a2a; cursor: default; }
  .model-pill.scanning { background: #1a1a3a; color: #7986cb; border: 1px solid #2a2a5a; cursor: default; }

  .chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-track { background: transparent; }
  .chat::-webkit-scrollbar-thumb { background: #3a3a4a; border-radius: 3px; }

  .msg { max-width: 78%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #3a3a6a; color: #dde; border-bottom-right-radius: 4px; }
  .msg.bot  { align-self: flex-start; background: #1e1e2a; color: #e2e2e2; border-bottom-left-radius: 4px; border: 1px solid #2e2e3e; }
  .msg.error { align-self: flex-start; background: #2a1515; color: #ff8a80; border: 1px solid #5a2525; font-family: monospace; font-size: 12px; }
  .msg.info  { align-self: center; background: transparent; color: #666; font-size: 12px; border: none; }
  .msg.typing { color: #888; font-style: italic; }

  .msg .meta { font-size: 11px; color: #666; margin-top: 6px; }

  .bottom { background: #1a1a1f; border-top: 1px solid #2e2e38; padding: 14px 20px; display: flex; gap: 10px; align-items: flex-end; }
  .bottom textarea { flex: 1; background: #252530; border: 1px solid #3a3a48; border-radius: 10px; padding: 10px 14px; color: #e2e2e2; font-size: 14px; resize: none; outline: none; font-family: inherit; min-height: 44px; max-height: 140px; }
  .bottom textarea:focus { border-color: #6c6cff; }
</style>
</head>
<body>

<div class="top">
  <h1>🔬 Gemini Model Lab</h1>
  <div class="key-wrap">
    <input type="text" id="apiKey" placeholder="Paste your API key here  e.g. AQ.Ab8RN6..." autocomplete="off" spellcheck="false" />
  </div>
  <div class="model-wrap">
    <select id="modelSelect">
      <option value="gemini-3.5-flash-lite" selected>gemini-3.5-flash-lite</option>
      <option value="gemini-3.6-flash">gemini-3.6-flash</option>
      <option value="gemini-3.8-flash">gemini-3.8-flash</option>
      <option value="gemini-flash-latest">gemini-flash-latest</option>
      <option value="gemini-3.5-flash">gemini-3.5-flash</option>
      <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
      <option value="gemini-flash-lite-latest">gemini-flash-lite-latest</option>
      <option value="gemini-2.5-flash">gemini-2.5-flash</option>
      <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
    </select>
  </div>
  <button id="scanBtn">🔍 Scan All Models</button>
  <button id="clearBtn" class="secondary">🗑 Clear</button>
</div>

<div class="scan-bar" id="scanBar" style="display:none">
  <span>Working models:</span>
  <div class="scan-results" id="scanResults"></div>
</div>

<div class="chat" id="chat">
  <div class="msg info">Enter your API key above, select a model, then type a message. Click "Scan All Models" to find which models work with your key.</div>
</div>

<div class="bottom">
  <textarea id="input" placeholder="Type a message and press Enter..." rows="1"></textarea>
  <button id="sendBtn">Send</button>
</div>

<script>
const MODELS_TO_SCAN = [
  'gemini-2.5-flash',
  'gemini-2.5-flash-lite',
  'gemini-3.1-flash-lite',
  'gemini-3.1-flash-lite-preview',
  'gemini-3.5-flash',
  'gemini-3.5-flash-lite',
  'gemini-3.6-flash',
  'gemini-3.7-flash',
  'gemini-3.8-flash',
  'gemini-flash-latest',
  'gemini-flash-lite-latest',
  'gemini-pro-latest',
];

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const apiKeyEl = document.getElementById('apiKey');
const modelSelect = document.getElementById('modelSelect');
const scanBtn = document.getElementById('scanBtn');
const clearBtn = document.getElementById('clearBtn');
const scanBar = document.getElementById('scanBar');
const scanResults = document.getElementById('scanResults');

// Save/load key
const savedKey = localStorage.getItem('gemini_test_key') || '';
if (savedKey) apiKeyEl.value = savedKey;
apiKeyEl.addEventListener('input', () => localStorage.setItem('gemini_test_key', apiKeyEl.value.trim()));

let history = [];

function addMsg(role, text, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    div.appendChild(m);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function getKey() {
  return apiKeyEl.value.trim();
}

function getModel() {
  return modelSelect.value;
}

async function callGemini(model, turns, key) {
  const contents = turns.map(t => ({
    role: t.role === 'bot' ? 'model' : 'user',
    parts: [{ text: t.text }]
  }));

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-goog-api-key': key,
    },
    body: JSON.stringify({
      contents,
      generationConfig: { maxOutputTokens: 800, temperature: 0.8 }
    }),
    signal: AbortSignal.timeout(20000)
  });

  const data = await res.json();
  if (!res.ok) {
    const msg = data?.error?.message || JSON.stringify(data);
    throw new Error(`HTTP ${res.status}: ${msg}`);
  }
  const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
  if (!text) throw new Error('Empty response from model. finishReason: ' + (data?.candidates?.[0]?.finishReason || '?'));
  return text;
}

async function send() {
  const key = getKey();
  if (!key) { addMsg('error', 'No API key! Paste your key in the field above.'); return; }

  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';

  addMsg('user', text);
  history.push({ role: 'user', text });

  const model = getModel();
  const typing = addMsg('typing', `${model} is thinking...`);
  sendBtn.disabled = true;

  const t0 = Date.now();
  try {
    const reply = await callGemini(model, history, key);
    typing.remove();
    const elapsed = ((Date.now() - t0) / 1000).toFixed(1);
    addMsg('bot', reply, `model: ${model}  •  ${elapsed}s`);
    history.push({ role: 'bot', text: reply });
  } catch (err) {
    typing.remove();
    addMsg('error', `ERROR: ${err.message}`);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

// Scan all models
async function scanModels() {
  const key = getKey();
  if (!key) { addMsg('error', 'No API key! Paste your key first.'); return; }

  scanBar.style.display = 'flex';
  scanResults.innerHTML = '';
  scanBtn.disabled = true;
  scanBtn.textContent = '⏳ Scanning...';
  addMsg('info', `Scanning ${MODELS_TO_SCAN.length} models... please wait`);

  const working = [];

  for (const model of MODELS_TO_SCAN) {
    const pill = document.createElement('button');
    pill.className = 'model-pill scanning';
    pill.textContent = `⏳ ${model}`;
    scanResults.appendChild(pill);
    chat.scrollTop = chat.scrollHeight;

    try {
      const reply = await callGemini(model, [{ role: 'user', text: 'Say the word "ok" only.' }], key);
      pill.className = 'model-pill ok';
      pill.textContent = `✅ ${model}`;
      pill.title = `Reply: ${reply.slice(0, 60)}`;
      pill.addEventListener('click', () => {
        modelSelect.value = model;
        document.querySelectorAll('.model-pill').forEach(p => p.classList.remove('selected'));
        pill.classList.add('selected');
        addMsg('info', `Switched to model: ${model}`);
      });
      // Add to select if not already there
      if (![...modelSelect.options].find(o => o.value === model)) {
        const opt = document.createElement('option');
        opt.value = model;
        opt.textContent = model;
        modelSelect.insertBefore(opt, modelSelect.firstChild);
      }
      modelSelect.value = model;
      working.push(model);
    } catch (err) {
      const short = err.message.includes('429') ? '429 quota' :
                    err.message.includes('404') ? '404 not found' :
                    err.message.includes('403') ? '403 forbidden' :
                    err.message.slice(0, 40);
      pill.className = 'model-pill err';
      pill.textContent = `❌ ${model}`;
      pill.title = short;
    }

    // Small delay between requests to avoid flooding
    await new Promise(r => setTimeout(r, 600));
  }

  scanBtn.disabled = false;
  scanBtn.textContent = '🔍 Scan All Models';

  if (working.length > 0) {
    addMsg('info', `✅ ${working.length} working model(s): ${working.join(', ')}\n❌ ${MODELS_TO_SCAN.length - working.length} failed`);
  } else {
    addMsg('error', `No models worked. Check your API key and try again.\nAll ${MODELS_TO_SCAN.length} models failed.`);
  }
}

scanBtn.addEventListener('click', scanModels);
clearBtn.addEventListener('click', () => {
  history = [];
  chat.innerHTML = '<div class="msg info">Chat cleared. History reset.</div>';
});

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});
</script>
</body>
</html>
